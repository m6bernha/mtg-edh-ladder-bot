name: CI

on:
  push:
    branches: [main]
  # Every PR, whatever its base — stacked PRs need checks before their base lands.
  pull_request:

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      # Blocks on a known-vulnerable RUNTIME dependency: only those ship in the
      # Worker bundle. Kept at `high` so low-severity noise does not block.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev tooling is still audited and shows as a warning, but does not block.
      # 2026-11: picomatch GHSA-fc5q-39xc-vjpf covered every published version.
      - name: Audit dev dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
